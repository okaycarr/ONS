name: ottawa-heat
channels:
  - conda-forge
dependencies:
  - python=3.11
  - geopandas
  - rioxarray
  - rasterio
  - pystac-client
  - planetary-computer
  - numpy
  - pandas
  - matplotlib
  - folium
  - mapclassify   # needed by geopandas for choropleth classification
  - scipy         # regression stats for the heat-wave analysis
  - requests      # ECCC weather download
  - tqdm          # progress bars during downloads
